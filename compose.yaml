services:
  postgres:
    image: postgres:17
    container_name: career-os-postgres
    environment:
      POSTGRES_DB: career_os
      POSTGRES_USER: career_os
      POSTGRES_PASSWORD: career_os_dev
    ports:
      - "5432:5432"
    volumes:
      - career_os_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_os -d career_os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  career_os_postgres_data: